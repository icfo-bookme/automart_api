name: Auto Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sshpass & rsync
        run: |
          sudo apt-get update -y
          sudo apt-get install -y sshpass rsync

      # Code upload 
      - name: Upload code to server
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          sshpass -p "$PASS" rsync -az \
            -e "ssh -o StrictHostKeyChecking=no" \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'vendor' \
            --exclude '.env' \
            --exclude 'public/storage' \
            --exclude 'storage/app' \
            --exclude 'storage/logs/*.log' \
            ./ "$USER@$HOST:/var/www/automart_api/"

      # Server-এ Composer, Permissions & Cache Clear (Nginx + PHP-FPM Friendly)
      - name: Post-deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          disable_host_key_checking: true
          script: |
            cd /var/www/automart_api

            # 1. PHP 8.2  Composer Dependencies
            COMPOSER_ALLOW_SUPERUSER=1 php8.2 /usr/bin/composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            # 2. File and Directory Permissions 
            sudo chown -R www-data:www-data /var/www/automart_api
            sudo chmod -R 775 /var/www/automart_api/storage /var/www/automart_api/bootstrap/cache

            # 3. Cache Clear & Production Optimization
            sudo -u www-data php8.2 artisan optimize:clear
            sudo -u www-data php8.2 artisan config:cache
            sudo -u www-data php8.2 artisan route:cache
            sudo -u www-data php8.2 artisan view:cache

            # 4. PHP-FPM & Nginx Reload
            sudo systemctl reload php8.2-fpm
            sudo systemctl reload nginx